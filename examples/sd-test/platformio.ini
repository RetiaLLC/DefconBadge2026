; SD card smoke test for the 2024 DEF CON badge.
; Mounts the dedicated micro-SD slot (CS on GPIO10, shared SPI bus),
; formatting the card FAT if it isn't already, then writes and reads
; a test file and prints the result on the USB serial console.

[env:defcon-badge]
platform = espressif32
board = defcon-badge
framework = espidf
monitor_speed = 115200
